[project]
name = "claude-code-tts-windows"
version = "0.2.0"
description = "Windows port of the Kokoro TTS hooks: a persistent TTS daemon (Kokoro on CUDA or Paradee on CPU) plus Claude Code hooks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "onnxruntime-gpu[cuda,cudnn]>=1.31.0",
    "sounddevice>=0.5.6",
    "mistune>=3.0.0",
    # Paradee-8M, a small Kokoro distillation that runs on the CPU (not on PyPI)
    "paradee",
    # misaki (Paradee's G2P) runs `pip install` for this spaCy model on first use,
    # which fails in a uv venv; install it up front instead
    "en-core-web-sm",
]

[tool.uv]
package = false
override-dependencies = [
    # kokoro-onnx and paradee depend on the CPU "onnxruntime" wheel, which installs
    # into the same package directory as onnxruntime-gpu and would shadow it.
    "onnxruntime; sys_platform == 'never'",
    # misaki asks for phonemizer-fork and kokoro-onnx for phonemizer; both install
    # the "phonemizer" package. Upstream 3.4 has the set_data_path misaki needs.
    "phonemizer-fork; sys_platform == 'never'",
]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
paradee = { git = "https://github.com/sahilmahendrakar/paradee", rev = "c2789ef9abf54a9384eef89cc7de3f1afe5ad01d" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
