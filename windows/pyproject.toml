[project]
name = "claude-code-tts-windows"
version = "0.1.0"
description = "Windows/CUDA port of the Kokoro TTS hooks: a persistent GPU daemon plus Claude Code hooks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "onnxruntime-gpu[cuda,cudnn]>=1.31.0",
    "sounddevice>=0.5.6",
    "mistune>=3.0.0",
]

[tool.uv]
package = false
# kokoro-onnx depends on the CPU "onnxruntime" wheel, which installs into the same
# package directory as onnxruntime-gpu and would shadow it. Drop it entirely.
override-dependencies = ["onnxruntime; sys_platform == 'never'"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
